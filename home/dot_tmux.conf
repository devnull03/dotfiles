
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

set -g base-index 1
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'catppuccin/tmux'

# Catppuccin theme
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_status_background 'default'
set -g @catppuccin_window_status_style 'rounded'

source-file ~/.config/tmux/workmux.conf

run '~/.tmux/plugins/tpm/tpm'

# Catppuccin status line (must be defined after the theme is loaded)
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_host}"

# Workmux and pane title integration
source-file ~/.config/tmux/workmux.conf
