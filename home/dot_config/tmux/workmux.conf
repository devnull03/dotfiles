# Keep Debian's existing theme and Alt+A prefix.
set -g pane-border-status top
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'
set -g pane-border-format ' #[fg=#cba6f7]#{pane_index} #[fg=#cdd6f4]#{pane_title} #[fg=#6c7086]#{pane_current_command} '
set -g set-titles on
set -g set-titles-string '#S: #W - #{pane_title}'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
bind-key D display-popup -E -w 90% -h 85% '~/.local/bin/workmux dashboard'
bind-key R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
