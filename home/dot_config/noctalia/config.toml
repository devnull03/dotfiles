# Noctalia: bar + dock + OSD + lock + wallpaper. Notifications stay on swaync.
# GUI changes (Mod+Shift+S) go to ~/.local/state/noctalia/settings.toml and override this file.

[shell]
polkit_agent = true
font_family = "Inter"

[notification]
enable_daemon = false

[theme]
source = "builtin"
builtin = "Catppuccin"
mode = "dark"

# ── Bar: macOS-style menu bar (full width, thin, translucent, monochrome) ──
[bar.default]
position = "top"
thickness = 28
margin_edge = 0
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
background_opacity = 0.55
border_width = 0.0
shadow = false
padding = 14
widget_spacing = 12
font_weight = 500
start = ["launcher", "workspaces", "active_window"]
center = []
end = ["tray", "tailscale", "brightness", "volume", "bluetooth", "network", "battery", "session", "clock"]

[widget.launcher]
# Tabler (the bar icon font) has no Arch logo, so use the image, tinted to the theme.
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true

[widget.launcher.actions]
left = "panel-toggle control-center home" # Arch logo opens the control center home

[widget.clock]
format = "{:%a %d %b  %H:%M}"
font_weight = 500

[widget.active_window]
max_length = 360
title_scroll = "none"
font_weight = 700

# Community plugin davemhammer/tailscale (enable: noctalia msg plugins enable davemhammer/tailscale).
[widget.tailscale]
type = "davemhammer/tailscale:status"
show_counts = false

[widget.network]
show_label = false # icon only, no SSID

# ── Dock: macOS-style, floating, auto-hides, magnifies on hover ──
[dock]
# macOS-style dock: floating frosted-glass pill with a thin light rim, tight icon spacing,
# small running dots and hover magnification
# (stock dock keeps a fixed-size pill, so magnification is kept modest to limit neighbor jitter).
enabled = true
position = "bottom"
icon_size = 48
item_spacing = 4
main_axis_padding = 6
cross_axis_padding = 5
margin_edge = 6
radius = 22
radius_top_left = 22
radius_top_right = 22
radius_bottom_left = 22
radius_bottom_right = 22
concave_edge_corners = false
background_opacity = 0.42
compositor_blur = true
border = "#ffffff2e"
border_width = 1.0
shadow = false
icon_shadow = true
magnification = true
magnification_scale = 1.3
active_scale = 1.0
inactive_scale = 1.0
active_opacity = 1.0
inactive_opacity = 1.0
show_dots = true
show_instance_count = false
auto_hide = true
auto_hide_reveal_delay_ms = 0
reserve_space = false
# dock-downloads / dock-trash are generated by ~/.local/bin/dock-stacks (macOS Downloads stack + Trash).
pinned = ["zen", "dev.noctalia.luciole", "com.mitchellh.ghostty", "dev.zed.Zed", "discord", "steam", "dock-downloads", "dock-trash"]

# Push the palette to apps (writes ~/.config/ghostty/themes/noctalia and live-reloads Ghostty).
[theme.templates]
builtin_ids = ["ghostty", "btop", "niri"]

[theme.templates.user.luciole]
input_path = "/usr/share/luciole/templates/colors.toml"
output_path = "~/.config/luciole/colors.toml"
