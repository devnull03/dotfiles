unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

set -g base-index 1
set -g mouse on
bind | split-window -h -c "#{pane_current_path}"  # | splits left/right
bind - split-window -v -c "#{pane_current_path}"  # - splits top/bottom

# Prefix + f: fuzzy-pick project files and insert @paths in the current pane
bind f run-shell -b "tmux display-popup -c '#{client_tty}' -EE -w 80% -h 80% '$HOME/.local/bin/tmux-project-file-picker #{pane_id}'"

# lazygit in a centered popup (prefix + g), opened in the current pane's directory
bind g display-popup -E -w 75% -h 75% -d "#{pane_current_path}" lazygit

# Tool popups, matching lazygit. Prefix + d hides ccswap without stopping it.
bind b display-popup -E -w 75% -h 75% -d "#{pane_current_path}" btop
bind C display-popup -E -w 75% -h 75% -d "#{pane_current_path}" '"$HOME/.local/bin/tmux-tool-popup"'
# Escape hides persistent tool popups; other panes receive Escape normally.
bind-key -n Escape if-shell -F '#{@tool-popup}' 'detach-client' 'send-keys Escape'

# workmux agent sidebar: always on (idempotent; new windows get it via workmux's hook)
run-shell -b "workmux sidebar on"
bind S run-shell "workmux sidebar"   # toggle sidebar

# workmux dashboard in a popup
bind A display-popup -h 30 -w 100 -E "workmux dashboard"   # agents
bind W display-popup -h 30 -w 100 -E "workmux dashboard --tab worktrees"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# --- Theme matching the workmux README screenshot ---
# Pane titles drawn on the top border: "<index>: <running command>"
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#87d75f"

# Status bar: dark background, green session/clock, green pill for the active window
set -g status-style "bg=#121212,fg=#d6d6d6"
set -g status-left "#[fg=#9fca56]#S "
set -g status-left-length 30
set -g status-right "#[fg=#9fca56]%d.%m. %H:%M"
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style "bg=#9fca56,fg=#121212"
set -g window-status-separator ""

# Allow Neovim OSC 52 copies to reach the local terminal over SSH.
set -s set-clipboard on
