watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: "komorebic start --masir --ahk && powershell -NoProfile -ExecutionPolicy Bypass -File %USERPROFILE%/.config/yasb/sync-gaps.ps1"
  stop_command: "komorebic stop --masir --ahk"
  reload_command: "komorebic stop --masir --ahk && komorebic start --masir --ahk && powershell -NoProfile -ExecutionPolicy Bypass -File %USERPROFILE%/.config/yasb/sync-gaps.ps1"
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
    blur_effect:
      enabled: true 
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 34
    padding:
      top: 7
      left: 7
      bottom: 0
      right: 7
    widgets:
      left: ["home","komorebi_workspaces","komorebi_active_layout","active_window"]
      center: ["audio_visualizer","clock","media"]
      right: ["claude_usage","codex_usage","systray","wifi","battery","volume","control_center"]
widgets:
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 56
      max_length_ellipsis: "..."
      monitor_exclusive: true
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a, %d %b %H:%M}"
      label_alt: "{%A, %d %B %Y %H:%M:%S}"
      timezones: []
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "\u23fc Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: "{index}"
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: true
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: false
      label: "{icon}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack']
      layout_icons:
        bsp: "[\\\\]"
        columns: "[||]"
        rows: "[==]"
        grid: "[G]"
        vertical_stack: "[V]="
        horizontal_stack: "[H]="
        ultrawide_vertical_stack: "||="
        monocle: "[M]"
        maximized: "[X]"
        floating: "><>"
        paused: "[P]"
      callbacks:
        on_left: "next_layout"
        on_middle: "toggle_monocle"
        on_right: "prev_layout" 
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_if_offline: true
  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"
  claude_usage:
    type: "yasb.claude_usage.ClaudeUsageWidget"
    options:
      label: "<img src='file:///C:/Users/Arnav/.config/yasb/icons/claude.svg' width='11' height='11'> {five_hour}%"
      label_alt: "<img src='file:///C:/Users/Arnav/.config/yasb/icons/claude.svg' width='11' height='11'> 7d {seven_day}% \u00b7 {seven_day_reset}"
      update_interval: 60
      five_hour_reset_format: "relative"
      seven_day_reset_format: "absolute"
      tooltip: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "refresh"
        on_right: "toggle_label"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
  codex_usage:
    type: "yasb.codex_usage.CodexUsageWidget"
    options:
      label: "<img src='file:///C:/Users/Arnav/.config/yasb/icons/openai.svg' width='11' height='11'> {primary_used}%{stale}"
      label_alt: "<img src='file:///C:/Users/Arnav/.config/yasb/icons/openai.svg' width='11' height='11'> {secondary_window} {secondary_used}% \u00b7 {secondary_reset}"
      update_interval: 60
      cache_ttl: 120
      timeout: 15
      show_token_usage: true
      progress_bar:
        enabled: false
      tooltip: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "refresh"
        on_right: "toggle_label"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        show_overview: true
        show_models: true
        show_activity: true
        show_resets: true
        show_details: true
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{volume}"
      icons:
        - "\ueee8"
        - "\uf026"
        - "\uf027"
        - "\uf027"
        - "\uf028"
      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:sound"
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | time: {time_remaining}"
      charging_options:
        icon_format: "{charging_icon}"
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 5000
      callbacks:
        on_left: "exec quick_settings"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "toggle_label"
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "<span>\ue62a</span>"
      menu_list:
        - { title: "User Home", path: "~" }
        - { title: "Downloads", path: "C:\\Users\\Arnav\\Downloads" }
        - { title: "Documents", path: "C:\\Users\\Arnav\\Documents" }
        - { title: "Pictures", path: "C:\\Users\\Arnav\\Pictures" }
        - { separator: true }
        - { title: "Windows Settings", uri: "ms-settings:" }
        - { title: "Task Manager", command: "cmd.exe /c start Taskmgr" }
        - { title: "Terminal", command: "wezterm-gui", show_window: true }
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "System"
      alignment: "left"
      direction: "down"
      offset_top: 6
      callbacks:
        on_left: "toggle_menu"
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\udb80\udf5e"
      label_expanded: "\udb80\udf5f"
      label_position: "right"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false
      show_battery: false
      show_volume: false
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: dots
      height: 16
      smoothness: 75
      sensitivity: 50
      freq_min: 60
      freq_max: 12000
      hide_idle: true
      channels: stereo
      mirror: true
      edge_fade: 4
      waves:
        width: 80
      dots:
        count: 37
        size: 2
        gap: 2
      bars:
        count: 16
        width: 2
        gap: 3
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title} - {artist}"
      label_alt: "{title}"
      hide_empty: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      max_field_size:
        label: 15
        label_alt: 30
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 11
      symmetric_corner_radius: true
      thumbnail_edge_fade: true
      icons:
        prev_track: "\udb81\udcae"
        next_track: "\udb81\udcad"
        play: "\udb81\udc0a"
        pause: "\udb80\udfe4"
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ue713</span>"
      tooltip: true
      popup:
        alignment: "right"
        direction: "down"
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        offset_top: 6
      callbacks:
        on_left: "toggle_menu"
  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span>\ueba1</span>"
      label_alt: "Notifications {data}"
      token: env
      max_notification: 30
      only_unread: false
      max_field_size: 54
      update_interval: 60
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      grouping:
        enabled: true
        show_count: true
      ignore_apps:
        processes: []
        titles: []
        classes: []
