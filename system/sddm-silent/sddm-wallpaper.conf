# Folders SilentSDDM picks its random login wallpaper from (searched recursively).
# Images (jpg/png/webp), videos (mp4/webm/mkv/mov) and GIFs (converted to mp4, since
# the theme crashes on GIFs) are all used. Re-run sync after adding files, or reboot.
SOURCES=(
  "/home/dvnl/Pictures/gif wallpapers"
  "/home/dvnl/Pictures/Wallpapers"
)

# Gaussian blur strength for the frosted login background (re-run sync after changing).
BLUR_SIGMA=12
# 1 = frosted background on the lock screen too, 0 = sharp wallpaper there.
BLUR_LOCKSCREEN=0
