# SilentSDDM theme (sddm-silent-theme from the AUR).
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent

[X11]
# Picks a random wallpaper before each greeter start.
DisplayCommand=/usr/local/lib/sddm-wallpaper/xsetup
