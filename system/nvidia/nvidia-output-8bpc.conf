# Cap NVIDIA display output at 8 bits per colour.
# The Pixio PX278 advertises 10 bpc, so nvidia-modeset drives it at 10 bpc. 2560x1440@144
# (583.6 MHz) then needs 17.5 Gbps, just over the 17.28 Gbps a 4-lane HBR2 link carries,
# so the link drops and the monitor blanks. At 8 bpc it needs 14.0 Gbps and fits, which
# is what Windows picks automatically. nvidia-drm has no "max bpc" connector property,
# so niri can't cap it itself. Install: sudo install -m644 this /etc/modprobe.d/
options nvidia-modeset max_output_color_depth=8
